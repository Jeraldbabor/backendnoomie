# Fails when docs/ doesn't match the API: undocumented or stale routes, broken links, or API
# code changes without a docs/CHANGELOG.md entry. See scripts/check-docs.mjs.
name: Docs

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the changelog check compares with the base branch
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check docs match the API
        # The script needs no dependencies, so there's no npm install.
        run: node scripts/check-docs.mjs --since "$BASE_REF"
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
